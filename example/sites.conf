# One site per line: name, git repo, branch to deploy, port its server listens on ("-" if none).
# On every push to that branch the box builds the repo in /www/sites/<name>/{a,b} and swaps
# /www/sites/<name>/current to the new build; if the repo has an executable deploy/start, it runs
# as the systemd unit www@<name>. Routes live in the Caddyfile. Changes apply when you run install.sh.
#
# name      repo                                     branch  port
app         https://github.com/you/app.git           main    8787
app-staging https://github.com/you/app.git           staging 8788
docs        git@github.com:you/private-docs.git      main    -
